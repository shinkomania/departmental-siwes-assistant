{% extends "base.html" %}

{% block title %}Admin Login | Departmental SIWES Assistant{% endblock %}

{% block content %}
<div class="container-narrow" style="max-width: 480px; margin-top: 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <div class="brand-icon" style="width: 3.5rem; height: 3.5rem; font-size: 1.75rem; margin: 0 auto 1rem;">🔒</div>
        <h1 style="font-size: 2rem; margin-bottom: 0.25rem;">Administrator Access</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">
            Authenticate to manage verified organizations and SIWES knowledge topics.
        </p>
    </div>

    <div class="form-card">
        <form action="{{ url_for('admin.login', next=request.args.get('next')) }}" method="POST">
            <div class="form-group">
                <label class="form-label">Admin Username</label>
                <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                Sign In to Admin Panel
            </button>
        </form>

        <div
            style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--text-light); text-align: center;">

        </div>
    </div>
</div>
{% endblock %}
